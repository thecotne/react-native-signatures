name: Release

# Stages the package on npm when a GitHub release is published.
# The release tag must be `v<version>` matching package.json (e.g. v0.2.0).
# Auth uses npm trusted publishing (OIDC) — no NPM_TOKEN secret needed.
# The trusted publisher only allows `npm stage publish`: a maintainer approves
# the staged version on npmjs.com (or `npm stage approve`) with 2FA to publish it.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          # Node 24 ships npm 11, which trusted publishing requires.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package.json version
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match package.json ($expected)"
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: CI=true pnpm test
      - run: pnpm build
      # Dependencies and the build use pnpm; staging stays on npm because
      # `npm stage publish` (trusted publishing with 2FA approval) is npm-only.
      # `npm stage` first shipped in npm 11.20.0, newer than Node 24's bundled npm.
      - run: npm install -g npm@^11.20.0
      - name: Stage for publishing
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm stage publish --access public --tag next
          else
            npm stage publish --access public
          fi
