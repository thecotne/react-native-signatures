name: CI

on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  library:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check src
      - run: npm run build
      - run: npm test
      - name: Check package contents
        run: npm pack --dry-run

  example-web:
    name: Example (typecheck + web export)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx tsc --noEmit -p .
        working-directory: example
      - run: npx expo export --platform web
        working-directory: example

  android:
    name: Example (Android build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform android --no-install
        working-directory: example
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -PreactNativeArchitectures=x86_64 --no-daemon
        working-directory: example/android

  ios:
    name: Example (iOS build)
    # Expo SDK 57 (expo-modules-jsi) needs Swift 6.2, i.e. Xcode 26.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform ios
        working-directory: example
      - name: Build for simulator
        working-directory: example/ios
        run: |
          xcodebuild -quiet \
            -workspace reactnativesignaturesexample.xcworkspace \
            -scheme reactnativesignaturesexample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
