plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

def packageJson = new groovy.json.JsonSlurper().parseText(file("${projectDir}/../package.json").text)

group = 'expo.modules.signatures'
version = packageJson.version

android {
  namespace "expo.modules.signatures"
  defaultConfig {
    versionCode 1
    versionName packageJson.version
  }
  lintOptions {
    abortOnError false
  }
}
